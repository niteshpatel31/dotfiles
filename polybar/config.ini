[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/example]
width = 100%
height = 24pt
radius = 6

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = monospace;2
font-1 = "Noto Color Emoji:scale=10;2"

modules-left = xworkspaces xwindow
modules-right = filesystem pulseaudio brightness xkeyboard memory cpu network-manager battery date

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/brightness]
type = custom/script
exec = brightnessctl -m | cut -d, -f4
interval = 0
format-prefix = "🔅 "
format-prefix-foreground = ${colors.primary}
label = %output%
scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

# --- NETWORK MODULES ---
[module/network-manager]
type = custom/script
# This command asks NetworkManager for the name of the active connection (WiFi SSID or "Wired Connection")
exec = nmcli -t -f NAME connection show --active 2>/dev/null | head -n 1
interval = 3

# Formatting
format-prefix = "ONLINE "
format-prefix-foreground = ${colors.primary}
label = %output%

# Show "Offline" if the command fails/outputs nothing
format-fail = <label-fail>
format-fail-foreground = ${colors.disabled}
label-fail = "OFFLINE"

# Click opens the network manager GUI
click-left = nm-connection-editor &

# --- BATTERY & DATE ---
[module/battery]
type = internal/battery
full-at = 99
low-at = 25
battery = BAT0
adapter = ADP1
poll-interval = 5

format-charging = 🔌 <label-charging>
format-discharging = 🔋 <label-discharging>
format-full = 🔋 <label-full>
format-low = 🪫 <label-low>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%

[module/date]
type = internal/date
interval = 1
date = %H:%M
# By keeping date and date-alt defined, Polybar will natively toggle between them on click!
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true
